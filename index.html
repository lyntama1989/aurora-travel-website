<script>
    // DATABASE UNIT RENTAL (Tetap Sama)
    const rentalCars = [
        { id:'zenix', name:'Innova Zenix 2024', price:'850.000', seat:'7 Penumpang', trans:'Matic', img:'https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=600', specs:'Hybrid, Captain Seat, AC Dingin, Audio Premium' },
        { id:'avanza', name:'Avanza New 2023', price:'450.000', seat:'7 Penumpang', trans:'Manual/Matic', img:'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=600', specs:'Lincah, Irit, Bagasi Luas, Multimedia Screen' },
        { id:'hiace', name:'Hiace Premio 2024', price:'1.200.000', seat:'14 Penumpang', trans:'Manual', img:'https://images.unsplash.com/photo-1580273916550-e323be2ae537?auto=format&fit=crop&w=600', specs:'Mewah, Reclining Seat, Audio Karaoke, Ruang Luas' },
        { id:'alphard', name:'Alphard Transformer', price:'2.800.000', seat:'6 Penumpang', trans:'Matic', img:'https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?auto=format&fit=crop&w=600', specs:'VIP Service, Pilot Seat, Sunroof, Mewah Maksimal' }
    ];

    // DATABASE PAKET WISATA (DIPERBARUI DENGAN FASILITAS & KONSUMSI DETAIL)
    const tourPackages = [
        { 
            id:'bali', 
            name:'Bali Premium 3D2N', 
            price:'2.450k', 
            img:'https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=600',
            rundown: [
                { day: 'Hari 1: South Bali Tour', schedule: ['10:00 - Penjemputan di Bandara', '12:00 - Lunch Ayam Betutu khas Bali', '14:00 - Pantai Melasti', '16:30 - Uluwatu & Tari Kecak', '19:00 - Seafood Dinner Jimbaran'] },
                { day: 'Hari 2: Kintamani Culture', schedule: ['08:00 - Breakfast Hotel', '10:00 - Desa Penglipuran', '12:30 - Lunch Buffet View Gunung Batur', '15:00 - Tirta Empul', '19:00 - Dinner Lokal Resto'] },
                { day: 'Hari 3: Shopping & Drop', schedule: ['08:00 - Breakfast & Check-out', '10:00 - Tanah Lot', '12:00 - Lunch & Belanja Oleh-oleh'] }
            ],
            facilities: [
                { cat: 'Transportasi', item: 'Mobil Private (Zenix/Avanza) + Driver & BBM' },
                { cat: 'Akomodasi', item: 'Hotel Bintang 4 (1 Kamar 2 Orang)' },
                { cat: 'Layanan', item: 'Tiket Masuk Wisata, Parkir, & Tol' },
                { cat: 'Tambahan', item: 'Mineral Water Unlimited & Welcome Snack' }
            ],
            meals: [
                { time: 'Sarapan', menu: '2x Buffet di Hotel' },
                { time: 'Makan Siang', menu: '3x (Ayam Betutu, Kintamani Buffet, Lokal Resto)' },
                { time: 'Makan Malam', menu: '2x (Jimbaran Seafood, Ayam Kedewatan)' }
            ],
            waMsg: 'Halo Aurora, saya ingin BOOKING Paket Bali Premium. Sudah baca detail konsumsi & fasilitasnya.'
        },
        { 
            id:'jogja', 
            name:'Jogja Heritage 2D1N', 
            price:'1.150k', 
            img:'https://images.unsplash.com/photo-1584810359583-96fc3448beaa?auto=format&fit=crop&w=600',
            rundown: [
                { day: 'Hari 1: Merapi & Malioboro', schedule: ['07:00 - Pick up Madiun', '10:00 - Jeep Lava Tour Merapi', '13:00 - Lunch Gudeg Pawon', '18:00 - Explore Malioboro'] },
                { day: 'Hari 2: Heritage & Beach', schedule: ['08:00 - Keraton & Tamansari', '12:00 - Lunch Bakmi Jawa / Ayam Goreng Kalasan', '14:00 - HeHa Ocean View'] }
            ],
            facilities: [
                { cat: 'Transportasi', item: 'Antar Jemput Madiun - Jogja (Private)' },
                { cat: 'Wisata', item: 'Jeep Merapi & Tiket Masuk Semua Spot' },
                { cat: 'Akomodasi', item: 'Hotel Bintang 3 Area Malioboro' },
                { cat: 'Safety', item: 'P3K Standar & Driver Profesional' }
            ],
            meals: [
                { time: 'Sarapan', menu: '1x Buffet Hotel' },
                { time: 'Makan Siang', menu: '2x (Gudeg Pawon, Ayam Kalasan)' },
                { time: 'Makan Malam', menu: '1x (Bakmi Jawa / Angkringan Modern)' }
            ],
            waMsg: 'Halo Aurora, saya tertarik Paket Jogja Heritage. Sudah jelas rundown dan makannya.'
        },
        { 
            id:'bromo', 
            name:'Bromo Sunrise & Malang', 
            price:'1.850k', 
            img:'https://images.unsplash.com/photo-1626244765695-103306915f08?auto=format&fit=crop&w=600',
            rundown: [
                { day: 'Hari 1: Batu City Tour', schedule: ['08:00 - Start Madiun', '13:00 - Jatim Park 3', '19:00 - Makan Malam & Istirahat Area Batu'] },
                { day: 'Hari 2: Bromo Adventure', schedule: ['02:00 - Jeep Bromo 4x4', '05:00 - Sunrise & Kawah', '09:00 - Breakfast', '13:00 - Petik Apel'] }
            ],
            facilities: [
                { cat: 'Khusus Bromo', item: 'Jeep 4x4 (Hardtop) & Tiket TNBTS' },
                { cat: 'Transportasi', item: 'Mobil Private Madiun-Malang PP' },
                { cat: 'Perlengkapan', item: 'Sewa Jaket & Sarung Tangan' },
                { cat: 'Dokumentasi', item: 'Free Foto/Video Selama di Bromo' }
            ],
            meals: [
                { time: 'Sarapan', menu: '2x (Hotel & Transit Bromo)' },
                { time: 'Makan Siang', menu: '2x (Lesehan Ikan Bakar, Masakan Jawa)' },
                { time: 'Makan Malam', menu: '1x (Kuliner Malam Batu)' }
            ],
            waMsg: 'Halo Aurora, saya mau booking Bromo & Malang. Fasilitas fotonya beneran free ya?'
        }
    ];

    // FUNGSI RENDER (CAR & TOUR GRID TETAP SAMA)
    const carGrid = document.getElementById('car-grid');
    rentalCars.forEach(car => {
        carGrid.innerHTML += `
            <div class="bg-white/5 rounded-[2.5rem] p-6 border border-white/10 group hover:border-indigo-500 transition-all duration-500">
                <img src="${car.img}" class="w-full h-44 object-cover rounded-3xl mb-6 group-hover:scale-105 transition">
                <h4 class="text-xl font-bold mb-1">${car.name}</h4>
                <p class="text-indigo-400 font-bold mb-4">Rp ${car.price} <span class="text-xs text-white/40 font-normal">/12 Jam</span></p>
                <button onclick="openRentalModal('${car.id}')" class="w-full py-3 border border-white/20 rounded-2xl text-xs font-bold hover:bg-white hover:text-slate-900 transition">Spesifikasi</button>
            </div>
        `;
    });

    const tourGrid = document.getElementById('tour-grid');
    tourPackages.forEach(tour => {
        tourGrid.innerHTML += `
            <div class="bg-white rounded-[3rem] overflow-hidden shadow-2xl group border border-slate-100">
                <div class="h-64 overflow-hidden relative">
                    <img src="${tour.img}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                </div>
                <div class="p-10 text-center">
                    <h3 class="text-2xl font-bold mb-2">${tour.name}</h3>
                    <p class="text-indigo-600 font-black mb-6">Rp ${tour.price}</p>
                    <button onclick="openTourModal('${tour.id}')" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-indigo-600 transition">Detail Lengkap</button>
                </div>
            </div>
        `;
    });

    // MODAL LOGIC (DIPERBARUI UNTUK DETAIL FASILITAS & MAKAN)
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modal-content');

    function openRentalModal(id) {
        const car = rentalCars.find(c => c.id === id);
        modalContent.innerHTML = `
            <div class="grid md:grid-cols-2 gap-10">
                <img src="${car.img}" class="w-full h-80 object-cover rounded-[2.5rem]">
                <div>
                    <h2 class="text-3xl font-extrabold text-indigo-600 mb-6">${car.name}</h2>
                    <ul class="space-y-3 mb-8">
                        <li class="flex justify-between border-b pb-2"><span class="text-slate-400">Kapasitas</span><span class="font-bold">${car.seat}</span></li>
                        <li class="flex justify-between border-b pb-2"><span class="text-slate-400">Transmisi</span><span class="font-bold">${car.trans}</span></li>
                        <li class="text-sm text-slate-500 mt-4 italic">${car.specs}</li>
                    </ul>
                    <a href="https://wa.me/628123456789?text=Halo Aurora, saya ingin sewa unit ${car.name}" class="block w-full bg-green-500 text-white text-center py-4 rounded-2xl font-bold">Booking Sekarang</a>
                </div>
            </div>
        `;
        modal.classList.remove('hidden');
        document.body.classList.add('modal-active');
    }

    function openTourModal(id) {
        const tour = tourPackages.find(t => t.id === id);
        modalContent.innerHTML = `
            <div class="space-y-10">
                <div class="text-center">
                    <h2 class="text-4xl font-black text-indigo-600 uppercase italic tracking-tighter">${tour.name}</h2>
                    <p class="text-slate-400 mt-2 font-bold">Layanan All-In & Transparan</p>
                </div>

                <div>
                    <h4 class="text-lg font-bold mb-6 flex items-center gap-2"><i class="fas fa-clock text-indigo-500"></i> Rundown Perjalanan</h4>
                    <div class="grid md:grid-cols-1 gap-4">
                        ${tour.rundown.map(day => `
                            <div class="bg-slate-50 p-6 rounded-[2rem] border border-slate-100">
                                <h5 class="font-bold text-indigo-700 mb-3">${day.day}</h5>
                                <ul class="space-y-2 text-sm text-slate-600">
                                    ${day.schedule.map(s => `<li>• ${s}</li>`).join('')}
                                </ul>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="grid md:grid-cols-2 gap-8">
                    <div class="bg-indigo-600 text-white p-8 rounded-[2.5rem] shadow-xl shadow-indigo-200">
                        <h4 class="font-bold mb-6 flex items-center gap-2"><i class="fas fa-concierge-bell"></i> Fasilitas VIP</h4>
                        <div class="space-y-4">
                            ${tour.facilities.map(f => `
                                <div class="border-b border-white/20 pb-2">
                                    <p class="text-[10px] uppercase opacity-70 font-bold tracking-widest">${f.cat}</p>
                                    <p class="text-sm font-semibold">${f.item}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="bg-white p-8 rounded-[2.5rem] border-2 border-slate-100">
                        <h4 class="font-bold mb-6 flex items-center gap-2 text-orange-500"><i class="fas fa-utensils"></i> Menu Konsumsi</h4>
                        <div class="space-y-6">
                            ${tour.meals.map(m => `
                                <div class="flex gap-4 items-start">
                                    <span class="bg-orange-100 text-orange-600 px-3 py-1 rounded-lg text-[10px] font-bold shrink-0">${m.time}</span>
                                    <p class="text-sm text-slate-600 font-medium leading-tight">${m.menu}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <a href="https://wa.me/628123456789?text=${encodeURIComponent(tour.waMsg)}" class="block w-full bg-slate-900 text-white text-center py-6 rounded-3xl font-extrabold text-xl hover:bg-indigo-600 transition shadow-2xl">PESAN PAKET SEKARANG</a>
            </div>
        `;
        modal.classList.remove('hidden');
        document.body.classList.add('modal-active');
    }

    function closeModal() {
        modal.classList.add('hidden');
        document.body.classList.remove('modal-active');
    }

    function toggleMenu() {
        document.getElementById('mobile-menu').classList.toggle('hidden');
    }
    document.getElementById('menu-toggle').addEventListener('click', toggleMenu);

    // Navbar Scroll Effect
    window.addEventListener('scroll', () => {
        const nav = document.getElementById('navbar');
        const logo = document.getElementById('logo-text');
        const links = document.getElementById('nav-links');
        const toggle = document.getElementById('menu-toggle');
        if (window.scrollY > 100) {
            nav.classList.add('bg-white', 'shadow-2xl', 'py-4');
            nav.classList.remove('py-6');
            logo.classList.replace('text-white', 'text-indigo-600');
            links.classList.replace('text-white/90', 'text-slate-800');
            toggle.classList.replace('text-white', 'text-slate-800');
        } else {
            nav.classList.remove('bg-white', 'shadow-2xl', 'py-4');
            nav.classList.add('py-6');
            logo.classList.replace('text-indigo-600', 'text-white');
            links.classList.replace('text-slate-800', 'text-white/90');
            toggle.classList.replace('text-slate-800', 'text-white');
        }
    });
</script>
